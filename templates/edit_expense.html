<!DOCTYPE html>
<html>

<head>
    <title>Edit Expense</title>
</head>

<body>

    <h1>Edit Expense</h1>

    <form action="/update-expense/{{ expense.id }}" method="post">

        <input
            type="text"
            name="title"
            value="{{ expense.title }}"
            required
        >

        <input
            type="number"
            name="amount"
            value="{{ expense.amount }}"
            required
        >

        <input
            type="text"
            name="category"
            value="{{ expense.category }}"
            required
        >

        <input
            type="date"
            name="date"
            value="{{ expense.date }}"
            required
        >

        <button type="submit">
            Save Changes
        </button>

    </form>

</body>

</html>
