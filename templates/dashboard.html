<!doctype html>
<html>
  <head>
    <title>Expense Tracker Dashboard</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }

      h1 {
        text-align: center;
      }

      form {
        width: 400px;
        margin: auto;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        margin-bottom: 15px;
      }

      button {
        width: 100%;
        padding: 10px;
        cursor: pointer;
      }

      table {
        width: 80%;
        margin: 40px auto;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid black;
        padding: 12px;
        text-align: center;
      }

      h2 {
        text-align: center;
        margin-top: 50px;
      }
    </style>
  </head>

  <body>
    <h1>Welcome, User</h1>

    <h2>Add Expense</h2>

    <form action="/add-expense" method="post">
      <input type="text" name="title" placeholder="Title" required />

      <input type="number" name="amount" placeholder="Amount" required />

      <input type="text" name="category" placeholder="Category" required />

      <input type="date" name="date" required />

      <button type="submit">Add Expense</button>
    </form>

    <h2>Your Expenses</h2>

    <table>
      <tr>
        <th>Title</th>
        <th>Amount</th>
        <th>Category</th>
        <th>Date</th>
      </tr>

      {% for expense in expenses %}

      <tr>
        <td>{{ expense.title }}</td>
        <td>{{ expense.amount }}</td>
        <td>{{ expense.category }}</td>
        <td>{{ expense.date }}</td>
      </tr>

      {% endfor %}
    </table>
  </body>
</html>
